<p><b>Higgs VoiceOver is installed.</b></p>
<p>To open it:</p>
<ol>
<li>If Premiere Pro is open, quit it and open it again.</li>
<li>Open a project.</li>
<li>In the menu bar, choose <b>Window &rsaquo; Extensions &rsaquo; Higgs VoiceOver</b>.</li>
</ol>
<p>The panel docks like any other; Premiere remembers where you put it.</p>
